<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="gear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#dc2626" stroke-width="2"/>
  
  <!-- Industrial gear symbol -->
  <g transform="translate(50,50)">
    <!-- Outer gear teeth -->
    <g fill="url(#gear)" opacity="0.3">
      <rect x="-2" y="-25" width="4" height="6" rx="1"/>
      <rect x="-2" y="19" width="4" height="6" rx="1"/>
      <rect x="-25" y="-2" width="6" height="4" rx="1"/>
      <rect x="19" y="-2" width="6" height="4" rx="1"/>
      <rect x="-18" y="-18" width="4" height="4" rx="1" transform="rotate(45)"/>
      <rect x="14" y="-18" width="4" height="4" rx="1" transform="rotate(-45)"/>
      <rect x="-18" y="14" width="4" height="4" rx="1" transform="rotate(-45)"/>
      <rect x="14" y="14" width="4" height="4" rx="1" transform="rotate(45)"/>
    </g>
    
    <!-- Main gear body -->
    <circle cx="0" cy="0" r="18" fill="url(#gear)" opacity="0.2"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.4"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="6" fill="white" opacity="0.8"/>
    
    <!-- Letter P -->
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">P</text>
  </g>
  
  <!-- Subtle highlight -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
  <circle cx="35" cy="35" r="8" fill="white" opacity="0.1"/>
</svg>